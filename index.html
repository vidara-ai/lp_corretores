      /* Animação de brilho metálico para o botão premium */
      @keyframes luxury-sheen {
        0% { transform: translateX(-150%) skewX(-25deg); }
        35% { transform: translateX(150%) skewX(-25deg); }
        100% { transform: translateX(150%) skewX(-25deg); }
      }

      .luxury-button-sheen::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.05) 15%,
          rgba(255, 255, 255, 0.35) 50%,
          rgba(255, 255, 255, 0.05) 85%,
          transparent
        );
        animation: luxury-sheen 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        z-index: 5;
        pointer-events: none;
      }

      /* Animação do Brilho no Texto Único */
      @keyframes text-glint {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }

      .keyword-container {
        display: inline-block;
        color: #fbbf24;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .animating {
        background: linear-gradient(90deg, 
          #fbbf24 0%, 
          #fbbf24 35%, 
          #ffffff 50%, 
          #fbbf24 65%, 
          #fbbf24 100%
        );
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: text-glint 2.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }

      .faded {
        opacity: 0 !important;
        pointer-events: none;
      }
